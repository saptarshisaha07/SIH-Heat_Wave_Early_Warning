<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhubaneswar Heatwave Early Warning</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23111827'/><path d='M16 6C16 6 10.5 12 10.5 17C10.5 20.04 12.96 22.5 16 22.5C19.04 22.5 21.5 20.04 21.5 17C21.5 12 16 6 16 6Z' fill='%23ef4444'/><path d='M16 12C16 12 13 15 13 17.5C13 19.16 14.34 20.5 16 20.5C17.66 20.5 19 19.16 19 17.5C19 15 16 12 16 12Z' fill='%23fbbf24'/></svg>">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header-container">
        <div class="header-brand">
            <div class="brand-logo-badge" aria-hidden="true">
                <svg class="brand-logo-svg" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="heatGradient" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#f59e0b" />
                            <stop offset="50%" stop-color="#ef4444" />
                            <stop offset="100%" stop-color="#b91c1c" />
                        </linearGradient>
                        <linearGradient id="pulseGradient" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#38bdf8" />
                            <stop offset="100%" stop-color="#6366f1" />
                        </linearGradient>
                    </defs>
                    <!-- Protective Radar Ring -->
                    <circle cx="16" cy="16" r="14" stroke="url(#pulseGradient)" stroke-width="1.5" stroke-dasharray="3 2" opacity="0.6"/>
                    <!-- Radiant Heat Rays -->
                    <path d="M16 3V6M16 26V29M3 16H6M26 16H29M6.8 6.8L8.9 8.9M23.1 23.1L25.2 25.2M6.8 25.2L8.9 23.1M23.1 8.9L25.2 6.8" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
                    <!-- Thermal Flame Core -->
                    <path d="M16 7C16 7 11 12.5 11 17C11 19.76 13.24 22 16 22C18.76 22 21 19.76 21 17C21 12.5 16 7 16 7Z" fill="url(#heatGradient)"/>
                    <path d="M16 13C16 13 13.5 15.8 13.5 17.5C13.5 18.88 14.62 20 16 20C17.38 20 18.5 18.88 18.5 17.5C18.5 15.8 16 13 16 13Z" fill="#fef08a"/>
                </svg>
            </div>
            <div class="header-titles">
                <h1>Bhubaneswar Heatwave Early Warning</h1>
                <p class="subtitle">Municipal Ward Risk & Vulnerability Assessment</p>
            </div>
        </div>
        <div class="score-mode-toggle-container" role="region" aria-label="Risk Score Evaluation Mode">
            <span class="toggle-label">Evaluation Mode:</span>
            <div class="score-mode-toggle">
                <button type="button" id="toggle-adjusted" class="toggle-btn active" data-mode="adjusted">Vulnerability-Adjusted</button>
                <button type="button" id="toggle-heat-only" class="toggle-btn" data-mode="heat_only">Heat-Only</button>
            </div>
        </div>
    </header>

    <div id="error-message" role="alert"></div>

    <div class="layout-container">
        <div id="map"></div>
        <aside id="ward-details" aria-live="polite">
            <p class="placeholder-text">Select a ward marker to view live details.</p>
        </aside>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/api.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/advisory.js"></script>
    <script src="js/alerts.js"></script>
    <script src="js/app.js"></script>
    <script src="js/map.js"></script>
</body>
</html>
