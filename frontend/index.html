<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhubaneswar Heatwave Early Warning</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header-container">
        <div class="header-titles">
            <h1>Bhubaneswar Heatwave Early Warning</h1>
            <p class="subtitle">Bhubaneswar Ward and Zone Map</p>
        </div>
        <div class="score-mode-toggle-container" role="region" aria-label="Risk Score Evaluation Mode">
            <span class="toggle-label">Evaluation Mode:</span>
            <div class="score-mode-toggle">
                <button type="button" id="toggle-adjusted" class="toggle-btn active" data-mode="adjusted">Vulnerability-Adjusted</button>
                <button type="button" id="toggle-heat-only" class="toggle-btn" data-mode="heat_only">Heat-Only</button>
            </div>
        </div>
    </header>

    <div id="error-message" role="alert"></div>

    <div class="layout-container">
        <div id="map"></div>
        <aside id="ward-details" aria-live="polite">
            <p class="placeholder-text">Select a ward marker to view live details.</p>
        </aside>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/api.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/advisory.js"></script>
    <script src="js/alerts.js"></script>
    <script src="js/app.js"></script>
    <script src="js/map.js"></script>
</body>
</html>
